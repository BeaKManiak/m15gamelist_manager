name: Build desktop app

# Run manually from the Actions tab, or automatically when you push a tag
# like "v1.0" -> this also creates a GitHub Release with the built apps.
#
# To also build on every push to main, uncomment the "branches" block.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    # branches:
    #   - main

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-13 = Intel (x86_64), macos-14 = Apple Silicon (arm64).
        # If macos-13 is unavailable, swap it for a newer runner and build
        # a universal2 binary instead.
        os:
          - macos-13
          - macos-14
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Verify tkinter is available
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Build app (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller \
            --noconfirm --clean --windowed \
            --name "M15Manager" \
            --osx-bundle-identifier "com.m15.rommanager" \
            --add-data "README.md:." \
            m15_gui.py
          # Ad-hoc signature: removes "damaged app" errors for most users.
          # Real distribution needs an Apple Developer ID + notarization.
          codesign --force --deep --sign - "dist/M15Manager.app" || true
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/M15Manager.app" "dist/M15Manager-${{ runner.arch }}.zip"

      - name: Build app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "M15Manager" `
            --add-data "README.md;." m15_gui.py
          Compress-Archive -Path "dist/M15Manager.exe" `
            -DestinationPath "dist/M15Manager-windows.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: M15Manager-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach builds to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
