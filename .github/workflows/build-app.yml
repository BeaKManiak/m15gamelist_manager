name: Build / release desktop app

# Three modes:
#   1. Manual run with "Publish a GitHub Release" unchecked (default):
#      build and upload artifacts only. No tag, no version bump, no release.
#   2. Manual run with publishing enabled:
#      build, create the resolved vX.Y.Z tag, and publish a GitHub Release.
#   3. Push a tag like v1.2.3:
#      build and publish that exact tag.
#
# Manual runs auto-increment the newest vMAJOR.MINOR.PATCH tag unless
# tag_override is set. Pre-release tags are published as pre-releases.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release after a successful build"
        type: boolean
        default: false
      bump:
        description: "Version bump to use when publishing (ignored if tag_override is set)"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      tag_override:
        description: "Exact version tag to publish, e.g. v2.0.0 (optional)"
        type: string
        required: false
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: desktop-app-${{ github.repository }}
  cancel-in-progress: false

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Run lint
        run: python -m ruff check .

  prepare:
    name: Resolve release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # required to see existing tags

      - name: Resolve the tag
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          OVERRIDE: ${{ inputs.tag_override }}
          DO_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          tag=""
          prerelease="false"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Tag push: publish exactly the tag that was pushed.
            tag="${GITHUB_REF_NAME:-${GITHUB_REF#refs/tags/}}"
          elif [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            # Branch push: build only.
            tag=""
          elif [[ "${DO_PUBLISH}" != "true" ]]; then
            # Manual run with publishing disabled: build only.
            tag=""
          elif [[ -n "${OVERRIDE}" ]]; then
            if [[ ! "${OVERRIDE}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag_override must look like v1.2.3 or v1.2.3-rc1"
              exit 1
            fi
            if git rev-parse --verify --quiet "refs/tags/${OVERRIDE}" >/dev/null; then
              echo "::error::Tag ${OVERRIDE} already exists"
              exit 1
            fi
            tag="${OVERRIDE}"
          else
            # Manual run: bump the newest vX.Y.Z tag (pre-releases ignored).
            latest="$(git tag --list --sort=-v:refname \
                        | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
            latest="${latest:-v0.0.0}"
            ver="${latest#v}"
            IFS=. read -r major minor patch <<< "${ver}"
            case "${BUMP}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              *)     patch=$((patch + 1)) ;;
            esac
            tag="v${major}.${minor}.${patch}"
          fi

          case "${tag}" in
            *-*) prerelease="true" ;;
          esac

          echo "Resolved tag: '${tag:-<none: build only>}'"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Summarize mode
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [[ -n "${TAG}" ]]; then
            if [[ "${PRERELEASE}" == "true" ]]; then
              echo "### Will publish pre-release ${TAG}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### Will publish ${TAG}" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "### Build only" >> "$GITHUB_STEP_SUMMARY"
            echo "No tag will be created and no GitHub Release will be published." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build on ${{ matrix.os }}
    needs: [prepare, test]
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 = Apple Silicon (arm64). Intel (x86_64) is no longer built:
        # the macos-13 image was retired in Dec 2025 and Apple has dropped Intel.
        os:
          - macos-15
          - windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==6.22.3"

      - name: Verify tkinter is available
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Build app (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller \
            --noconfirm --clean --windowed \
            --name "M15Manager" \
            --osx-bundle-identifier "com.m15.rommanager" \
            --add-data "README.md:." \
            --add-data "docs:docs" \
            m15_gui.py
          # Ad-hoc signature: removes "damaged app" errors for most users.
          # Real distribution needs an Apple Developer ID + notarization.
          codesign --force --deep --sign - "dist/M15Manager.app"
          codesign --verify --deep --strict --verbose=2 "dist/M15Manager.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/M15Manager.app" "dist/M15Manager-${{ runner.arch }}.zip"

      - name: Build app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "M15Manager" `
            --add-data "README.md;." `
            --add-data "docs;docs" m15_gui.py
          Compress-Archive -Path "dist/M15Manager.exe" `
            -DestinationPath "dist/M15Manager-windows.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: M15Manager-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish ${{ needs.prepare.outputs.tag }}
    needs: [prepare, build]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Tag and publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
